<!DOCTYPE html>>
<html>
<head>
<style>
p:first-child {
    color: blue;
}
</style>
</head>
<body>

    <h2>Use :first-child</h2>

    <p>Syle any p element that is the first child of element:</p>
    <div>
        <p>This is some text.</p>
        <p>This is some text.</p>
        <div>
            <p>This is some text.</p>
            <p>This is some text.</p>
        </div>
    </div>
</body>
</html>
