<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selektor Atrybutów</title>
    <style>
        a[target] {
            background-color: yellow;
        }
    </style>
</head>
<body>
    <h2>CSS [attribute] Selector</h2>
    <p>Select and style the links with a target attribute:</p>
    <a href="https://www.w3schools.com" target="blank">W3schools.com</a>
    <a href="https://www.w3schools.com/css/">CSS</a>
</body>
</html>
