<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input</title>
</head>
<body>
    <label for="name">wpisz wiek:</label>
    <input
            type="number"
            id="wiek"
            min="0"
            max="120">

    <label for="data_ur">data urodzenia:</label>
    <input
            type="date"
            id="date_ur"
            min="2000-01-01"><br>
    
    <label for="myfile">Wybierz plik</label>

    <label for="zakres">Volume: od 0</label>
    <input
            type="range"
            id="zakres"
            min="0"
            max="100"
            >100<br>

    <label for="kolor">wybierz kolor</label>
</body>
</html>
