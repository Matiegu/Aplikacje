<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        table {
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <table>
        <tr><td colspan="3">2022</td></tr>
        <tr><td></td><td></td><td></td></tr>
        <tr><td colspan="2" rowspan="2">FIESTA</td><td></td></tr>
        <tr><td></td><td></td><td></td></tr>
    </table>
</body>
</html>
